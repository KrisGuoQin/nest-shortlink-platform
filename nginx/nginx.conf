# Template rendered by the official Nginx image with an explicit env allowlist.
worker_processes auto;
events { worker_connections 4096; }

http {
    log_format shortlink '$request_id $remote_addr "$request" $status '
        'upstream=$upstream_addr upstream_status=$upstream_status '
        'request_time=$request_time upstream_time=$upstream_response_time';
    access_log /var/log/nginx/access.log shortlink;

    upstream shortlink_api {
        zone shortlink_api 64k;
        resolver 127.0.0.11 valid=5s ipv6=off;
        server ${API_UPSTREAM} ${API_RESOLVE} max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_connect_timeout 1s;
        proxy_read_timeout 10s;
        proxy_send_timeout 10s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
        # Empty in production, so internal addresses are not returned.
        add_header X-Upstream-Addr "${DEBUG_UPSTREAM}" always;

        location = /nginx-health {
            access_log off;
            return 200 'ok\n';
        }
        # Frontend /api prefix is stripped; existing direct routes remain usable.
        location /api/ {
            proxy_pass http://shortlink_api/;
        }
        location / {
            proxy_pass http://shortlink_api;
        }
    }
}
