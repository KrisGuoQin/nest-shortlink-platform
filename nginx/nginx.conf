worker_processes auto;

events {
    worker_connections 4096;
}


http {
    log_format shortlink
        '$request_id '
        '$remote_addr '
        '"$request" '
        '$status '
        'upstream=$upstream_addr '
        'upstream_status=$upstream_status '
        'request_time=$request_time '
        'upstream_time=$upstream_response_time';

    access_log
        /var/log/nginx/access.log
        shortlink;


    upstream shortlink_api {
        zone shortlink_api 64k;

        resolver
            127.0.0.11
            valid=5s
            ipv6=off;

        server
            api-1:3000
            resolve
            max_fails=3
            fail_timeout=10s;

        server
            api-2:3000
            resolve
            max_fails=3
            fail_timeout=10s;

        server
            api-3:3000
            resolve
            max_fails=3
            fail_timeout=10s;

        keepalive 128;
    }


    server {
        listen 80;

        server_name _;


        location / {
            proxy_pass
                http://shortlink_api;

            proxy_http_version 1.1;

            proxy_set_header
                Connection "";

            proxy_set_header
                Host
                $host;

            proxy_set_header
                X-Real-IP
                $remote_addr;

            proxy_set_header
                X-Forwarded-For
                $proxy_add_x_forwarded_for;

            proxy_set_header
                X-Forwarded-Proto
                $scheme;

            proxy_set_header
                X-Request-Id
                $request_id;

            proxy_connect_timeout
                1s;

            proxy_read_timeout
                10s;

            proxy_send_timeout
                10s;

            proxy_next_upstream
                error
                timeout
                http_502
                http_503
                http_504;

            proxy_next_upstream_tries
                3;

            add_header
                X-Upstream-Addr
                $upstream_addr
                always;
        }
    }
}