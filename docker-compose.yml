# Shared services; default mode proxies to the API started on the host.
# scripts/compose.sh selects dev / demo / prod.
x-logging: &logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

x-app: &app
  logging: *logging
  build:
    context: .
    target: runtime
  image: ${API_IMAGE:-shortlink-api:local}
  env_file:
    - ${APP_ENV_FILE:-.env.docker}
  restart: unless-stopped
  stop_grace_period: 30s
  networks: [shortlink]
  depends_on:
    migrate:
      condition: service_completed_successfully
    rabbitmq:
      condition: service_healthy
    otel-collector:
      condition: service_started

services:
  nginx:
    logging: *logging
    image: nginx:1.30.5-alpine

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/templates/nginx.conf.template:ro,z

    ports:
      - '127.0.0.1:8080:80'

    environment:
      NGINX_ENVSUBST_OUTPUT_DIR: /etc/nginx
      NGINX_ENVSUBST_FILTER: '^(API_UPSTREAM|API_RESOLVE|DEBUG_UPSTREAM)$'
      API_UPSTREAM: host.docker.internal:3000
      API_RESOLVE: ''
      DEBUG_UPSTREAM: '$$upstream_addr'
    extra_hosts: ['host.docker.internal:host-gateway']
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '-q',
          '-O',
          '/dev/null',
          'http://127.0.0.1/nginx-health',
        ]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

    networks:
      - shortlink

  postgres:
    logging: *logging
    restart: unless-stopped
    image: postgres:17-alpine

    environment:
      POSTGRES_USER: shortlink
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shortlink}
      POSTGRES_DB: shortlink

    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U shortlink -d shortlink']
      interval: 5s
      timeout: 3s
      retries: 10

    ports:
      - '127.0.0.1:5432:5432'

    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - shortlink

  redis-cluster:
    logging: *logging
    build: ./infra/redis-cluster
    image: ${REDIS_CLUSTER_IMAGE:-shortlink-redis-cluster:local}
    environment:
      REDIS_CLUSTER_HOSTNAME: ''
    ports: ['127.0.0.1:7100-7105:7100-7105']
    volumes: [redis_cluster_data:/data]
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'redis-cli -p 7100 cluster info | grep -q "cluster_state:ok"',
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s
    restart: unless-stopped
    stop_grace_period: 30s
    networks: [shortlink]

  redis:
    logging: *logging
    restart: unless-stopped
    image: redis:8-alpine
    ports:
      - '127.0.0.1:6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - shortlink

  rabbitmq:
    logging: *logging
    restart: unless-stopped
    hostname: rabbitmq
    image: rabbitmq:4-management

    environment:
      RABBITMQ_DEFAULT_USER: shortlink
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-shortlink}

    command: >
      sh -c "rabbitmq-plugins enable --offline rabbitmq_prometheus && rabbitmq-server"
    ports:
      - '127.0.0.1:5672:5672'
      - '127.0.0.1:15672:15672'
      - '127.0.0.1:15692:15692'

    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - shortlink

  postgres-exporter:
    logging: *logging
    restart: unless-stopped
    image: quay.io/prometheuscommunity/postgres-exporter:v0.20.1

    environment:
      DATA_SOURCE_URI: 'postgres:5432/shortlink?sslmode=disable'
      DATA_SOURCE_USER: shortlink
      DATA_SOURCE_PASS: ${POSTGRES_PASSWORD:-shortlink}

    ports:
      - '127.0.0.1:9187:9187'

    depends_on:
      - postgres
    networks:
      - shortlink

  redis-exporter:
    logging: *logging
    restart: unless-stopped
    image: oliver006/redis_exporter:v1.89.0

    environment:
      REDIS_ADDR: 'redis://redis:6379'

    ports:
      - '127.0.0.1:9121:9121'

    depends_on:
      - redis
    networks:
      - shortlink

  prometheus:
    logging: *logging
    restart: unless-stopped
    extra_hosts: ['host.docker.internal:host-gateway']
    image: prom/prometheus:v3.14.0

    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=7d'
      - '--storage.tsdb.retention.size=2GB'

    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro,z
      - ./observability/prometheus/targets/dev.yml:/etc/prometheus/api-targets.yml:ro,z
      - ./observability/prometheus/rules:/etc/prometheus/rules:ro,z
      - prometheus_data:/prometheus

    ports:
      - '127.0.0.1:9091:9090'

    depends_on:
      - postgres-exporter
      - redis-exporter
      - rabbitmq
    networks:
      - shortlink

  grafana:
    logging: *logging
    restart: unless-stopped
    image: grafana/grafana:13.2.2

    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}

    ports:
      - '127.0.0.1:3001:3000'

    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro,z
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro,z

    depends_on:
      - prometheus
    networks:
      - shortlink

  alertmanager:
    logging: *logging
    restart: unless-stopped
    image: prom/alertmanager:v0.34.1
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
    volumes:
      - ./observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro,z
      - alertmanager_data:/alertmanager
    ports:
      - '127.0.0.1:9093:9093'
    networks:
      - shortlink

  jaeger:
    logging: *logging
    restart: unless-stopped
    image: cr.jaegertracing.io/jaegertracing/jaeger:2.21.0

    ports:
      - '127.0.0.1:16686:16686'
    networks:
      - shortlink

  otel-collector:
    logging: *logging
    restart: unless-stopped
    image: otel/opentelemetry-collector:0.161.0

    command:
      - '--config=/etc/otelcol/config.yml'

    volumes:
      - ./observability/otel-collector/config.yml:/etc/otelcol/config.yml:ro,z

    ports:
      - '127.0.0.1:4317:4317'
      - '127.0.0.1:4318:4318'

    depends_on:
      - jaeger
    networks:
      - shortlink

  analytics-worker:
    logging: *logging
    <<: *app
    environment:
      OTEL_SERVICE_NAME: analytics-worker
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
      DB_POOL_MAX: 3
    command:
      [
        'node',
        '--import',
        './dist/telemetry/instrumentation.js',
        'dist/analytics-worker/main.js',
      ]

  outbox-worker:
    logging: *logging
    <<: *app
    environment:
      OTEL_SERVICE_NAME: outbox-worker
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
      DB_POOL_MAX: 3
    command:
      [
        'node',
        '--import',
        './dist/telemetry/instrumentation.js',
        'dist/outbox-worker/main.js',
      ]

  migrate:
    logging: *logging
    image: ${MIGRATION_IMAGE:-shortlink-migration:local}
    build:
      context: .
      target: migration
    env_file:
      - ${APP_ENV_FILE:-.env.docker}
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'
    networks:
      - shortlink

volumes:
  redis_cluster_data:
  alertmanager_data:
  postgres_data:
  rabbitmq_data:
  prometheus_data:
  grafana_data:

networks:
  shortlink:
    driver: bridge
