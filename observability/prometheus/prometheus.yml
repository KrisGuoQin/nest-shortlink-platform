global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

  - job_name: shortlink-api
    metrics_path: /metrics
    static_configs:
      - targets:
          - host.docker.internal:3000

  - job_name: analytics-worker
    metrics_path: /metrics
    static_configs:
      - targets:
          - host.docker.internal:9465

  - job_name: outbox-worker
    metrics_path: /metrics
    static_configs:
      - targets:
          - host.docker.internal:9466

  - job_name: postgres
    static_configs:
      - targets:
          - postgres-exporter:9187

  - job_name: redis
    static_configs:
      - targets:
          - redis-exporter:9121

  - job_name: rabbitmq
    static_configs:
      - targets:
          - rabbitmq:15692

  - job_name: rabbitmq-queues

    metrics_path: /metrics/detailed

    params:
      family:
        - queue_coarse_metrics
        - queue_consumer_count

    static_configs:
      - targets:
          - rabbitmq:15692
